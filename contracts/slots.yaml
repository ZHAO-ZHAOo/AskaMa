meta:
  id: slots
  version: 0.2.0
  status: draft_unreviewed
  sources: []
  reviewer: null
  last_verified: null

special_values:
- id: unknown
  meaning:
    en: The user does not know or is unsure
    zh: 用户不知道或不确定
- id: declined
  meaning:
    en: The user declines to answer
    zh: 用户不愿回答
slot_value_record:
  description: >-
    说明每个槽位的取值在运行时如何记录（只是文档，不是 schema）。
    每轮对话中，Intake 层抽取的每个槽位都会以一条记录的形式存储。
  fields: [slot_id, value, status, confidence, source_turn]
  status_values: [answered, unknown, declined, not_asked]

groups:
- {id: context, name: {en: Context, zh: 基本情况}}
- {id: cycle, name: {en: Cycle and timeline, zh: 周期与时间线}}
- {id: bleeding, name: {en: Bleeding, zh: 出血}}
- {id: pain, name: {en: Pain, zh: 疼痛}}
- {id: systemic, name: {en: Systemic symptoms, zh: 全身症状}}
- {id: self_care_and_text, name: {en: Self-care attempts and complaint text, zh: 自护尝试与主诉文本}}

type_notes:
  duration: >-
    duration 类型的取值结构为 {value: number, unit: hours|days|weeks}。
    例如持续 3 天的疼痛记为 {value: 3, unit: days}。
    运行时应附带 status 字段（answered / unknown / declined / not_asked）。

